<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE DARK BETWEEN THE STARS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }

body {
  background: #020107;
  color: #e9e5f2;
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow-x: hidden;
  cursor: crosshair;
}

::selection { background: #7b2ff7; color: #fff; }

/* ---------- BACKDROP LAYERS ---------- */
.nebula {
  position: fixed; border-radius: 50%; filter: blur(90px);
  pointer-events: none; opacity: .55; z-index: 0;
}
.n1 { width: 60vw; height: 60vw; left: -15vw; top: -20vh;
  background: radial-gradient(circle, #3b0f5e, transparent 65%);
  animation: drift1 26s ease-in-out infinite alternate; }
.n2 { width: 55vw; height: 55vw; right: -18vw; top: 10vh;
  background: radial-gradient(circle, #0f3b5e, transparent 65%);
  animation: drift2 32s ease-in-out infinite alternate; }
.n3 { width: 50vw; height: 50vw; left: 20vw; bottom: -30vh;
  background: radial-gradient(circle, #5e0f3b, transparent 65%);
  animation: drift3 38s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(8vw, 6vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-7vw, 9vh) scale(1.1); } }
@keyframes drift3 { to { transform: translate(6vw, -8vh) scale(1.2); } }

#stars, #embers { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
#embers { z-index: 2; }

.fog {
  position: fixed; inset: -25%;
  background:
    radial-gradient(ellipse 40% 30% at 20% 30%, rgba(123,47,247,.07), transparent 70%),
    radial-gradient(ellipse 35% 30% at 80% 70%, rgba(255,42,109,.06), transparent 70%);
  filter: blur(40px);
  pointer-events: none; z-index: 3;
  animation: fogdrift 24s ease-in-out infinite alternate;
}
@keyframes fogdrift { to { transform: translate(3vw, -2vh) scale(1.06); } }

.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.88) 100%);
}

.grain {
  position: fixed; inset: -100px; pointer-events: none; z-index: 5; opacity: .05;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="300" height="300" filter="url(%23n)"/></svg>');
  animation: grain 8s steps(10) infinite;
}
@keyframes grain {
  0%,100% { transform: translate(0,0); } 10% { transform: translate(-5%,-8%); }
  20% { transform: translate(-12%,4%); } 30% { transform: translate(6%,-14%); }
  40% { transform: translate(-4%,12%); } 50% { transform: translate(-10%,6%); }
  60% { transform: translate(12%,0%); } 70% { transform: translate(0,10%); }
  80% { transform: translate(3%,12%); } 90% { transform: translate(-8%,4%); }
}

/* ---------- HEARTBEAT ---------- */
.heartbeat-core {
  position: fixed; top: 46%; left: 50%; width: 70vmin; height: 70vmin;
  border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, rgba(123,47,247,.30), rgba(255,42,109,.13) 45%, transparent 70%);
  filter: blur(18px); opacity: 0;
}
.heartbeat-core.beat {
  animation: hb 1.05s ease-out forwards;
}
@keyframes hb {
  0%   { opacity: .6; transform: translate(-50%,-50%) scale(.90); }
  60%  { opacity: .28; transform: translate(-50%,-50%) scale(1.10); }
  100% { opacity: 0;  transform: translate(-50%,-50%) scale(1.0); }
}

/* ---------- CURSOR ---------- */
.cursor-dot, .cursor-ring {
  position: fixed; top:0; left:0; pointer-events: none; z-index: 100;
  border-radius: 50%; display: none;
}
.cursor-dot { width:7px; height:7px; background:#ff2a6d; box-shadow:0 0 12px #ff2a6d; }
.cursor-ring { width:38px; height:38px; border:1px solid rgba(123,47,247,.6); }
@media (pointer:fine){ .cursor-dot, .cursor-ring { display:block; } }

/* ---------- HERO ---------- */
.hero {
  position: relative; z-index: 5;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 0 8vw; text-align: center;
}
.overline {
  font-size: clamp(.65rem, 1.8vw, .9rem); letter-spacing: .5em; text-indent: .5em;
  color: #8f7fb8; font-weight: 400; text-transform: uppercase;
}
h1.glitch {
  position: relative; display: inline-block;
  font-family: 'Cinzel', serif; font-weight: 700;
  font-size: clamp(2.6rem, 9vw, 8rem);
  line-height: 1.08; letter-spacing: .02em;
  color: #f2eefb; margin-top: 1.5rem;
  text-shadow: 0 0 60px rgba(123,47,247,.45), 0 0 140px rgba(123,47,247,.2);
  animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { text-shadow: 0 0 60px rgba(123,47,247,.45), 0 0 140px rgba(123,47,247,.2);} 50% { text-shadow: 0 0 90px rgba(123,47,247,.8), 0 0 200px rgba(123,47,247,.35);} }
.glitch::before, .glitch::after {
  content: attr(data-text); position: absolute; inset: 0; overflow: hidden;
  pointer-events: none;
}
.glitch::before { color: #00f0ff; z-index: -1; }
.glitch::after  { color: #ff2a6d; z-index: -2; }
.glitching::before { animation: gl1 .32s steps(2) infinite; }
.glitching::after  { animation: gl2 .38s steps(2) infinite; }
@keyframes gl1 {
  0% { clip-path: inset(12% 0 62% 0); transform: translate(-4px,-2px); }
  25% { clip-path: inset(58% 0 12% 0); transform: translate(3px,1px); }
  50% { clip-path: inset(30% 0 40% 0); transform: translate(-2px,2px); }
  75% { clip-path: inset(70% 0 5% 0);  transform: translate(4px,-1px); }
  100% { clip-path: inset(5% 0 74% 0);  transform: translate(-3px,2px); }
}
@keyframes gl2 {
  0% { clip-path: inset(60% 0 8% 0); transform: translate(4px,2px); }
  25% { clip-path: inset(8% 0 70% 0); transform: translate(-3px,-1px); }
  50% { clip-path: inset(42% 0 34% 0); transform: translate(2px,-2px); }
  75% { clip-path: inset(15% 0 60% 0); transform: translate(-4px,1px); }
  100% { clip-path: inset(52% 0 22% 0); transform: translate(3px,2px); }
}

.rule {
  width: min(420px, 60vw); height: 1px; margin: 2.8rem auto 0;
  background: linear-gradient(90deg, transparent, #7b2ff7, transparent);
}
.sub {
  margin-top: 2.2rem; font-size: clamp(1.25rem, 2.6vw, 2rem);
  font-style: italic; font-weight: 300; color: #b9a8d6; line-height: 1.6;
}

/* ---------- WHISPERS ---------- */
.whispers {
  position: relative; z-index: 5;
  padding: 18vh 8vw 22vh;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.w-label {
  font-size: .7rem; letter-spacing: .5em; text-indent: .5em; color: #6f5d94;
  text-transform: uppercase; margin-bottom: 3rem;
}
.w-line {
  font-size: clamp(1.7rem, 4.6vw, 3.8rem);
  font-weight: 300; font-style: italic; color: #cfc3e8; line-height: 1.5;
  max-width: 22ch; transition: opacity 1.6s ease;
}

/* ---------- FOOTER ---------- */
.footer {
  position: relative; z-index: 5;
  text-align: center; padding: 6vh 8vw 9vh;
  color: #5d4c78; font-style: italic; font-size: .95rem;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>

<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<canvas id="stars"></canvas>
<canvas id="embers"></canvas>
<div class="fog"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="heartbeat-core"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<header class="hero">
  <p class="overline">✦ A Cosmic Confession ✦</p>
  <h1 class="glitch" data-text="THE DARK BETWEEN THE STARS">THE DARK BETWEEN THE STARS</h1>
  <div class="rule"></div>
  <p class="sub">the space where silence learned to breathe.</p>
</header>

<section class="whispers">
  <p class="w-label">whispers from the void</p>
  <p class="w-line" id="whisper">we were the dream the universe forgot</p>
</section>

<footer class="footer">
  <p>there is nothing after the quiet.<br>— you are still reading.</p>
</footer>

<script>
// ============ STARS ============
const starCanvas = document.getElementById('stars');
const starCtx = starCanvas.getContext('2d');
let W = 0, H = 0;
let stars = [];

function resizeStars() {
  W = starCanvas.width = innerWidth;
  H = starCanvas.height = innerHeight;
  stars = [];
  const count = Math.floor(innerWidth * innerHeight / 6500);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.6,
      depth: 0.2 + Math.random() * 0.8,
      color: Math.random() < 0.75 ? '255,255,255' : (Math.random() < 0.5 ? '150,120,255' : '140,220,255')
    });
  }
}
addEventListener('resize', resizeStars);
resizeStars();

const shoot = { x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 90 };
function maybeShoot(t) {
  if (Math.random() < 0.002 * (t / 10)) {
    shoot.x = Math.random() * W * 0.8 + W * 0.1;
    shoot.y = Math.random() * H * 0.3;
    shoot.vx = 6 + Math.random() * 4;
    shoot.vy = 3 + Math.random() * 2;
    shoot.life = shoot.max;
  }
}

function drawStars(t) {
  const px = (mouse.x - 0.5) * 24, py = (mouse.y - 0.5) * 24;
  starCtx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const x = s.x + px * s.depth, y = s.y + py * s.depth;
    const a = 0.2 + 0.65 * Math.abs(Math.sin(t * s.speed + s.phase));
    starCtx.globalAlpha = a;
    starCtx.fillStyle = `rgb(${s.color})`;
    starCtx.beginPath();
    starCtx.arc(x, y, s.r, 0, Math.PI * 2);
    starCtx.fill();
  }
  starCtx.globalAlpha = 1;
  maybeShoot(t);
  if (shoot.life > 0) {
    shoot.life--;
    const grad = starCtx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 8, shoot.y - shoot.vy * 8);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    starCtx.strokeStyle = grad;
    starCtx.lineWidth = 1.5;
    starCtx.beginPath();
    starCtx.moveTo(shoot.x, shoot.y);
    starCtx.lineTo(shoot.x - shoot.vx * 8, shoot.y - shoot.vy * 8);
    starCtx.stroke();
    shoot.x += shoot.vx; shoot.y += shoot.vy;
  }
}

// ============ EMBERS ============
const emberCanvas = document.getElementById('embers');
const ectx = emberCanvas.getContext('2d');
let E = 0, EH = 0;
let embers = [];

function resizeEmbers() {
  E = emberCanvas.width = innerWidth;
  EH = emberCanvas.height = innerHeight;
}
addEventListener('resize', resizeEmbers);
resizeEmbers();

function spawnEmber() {
  embers.push({
    x: Math.random() * E,
    y: Math.random() * EH,
    r: 0.8 + Math.random() * 2.6,
    vy: -(0.12 + Math.random() * 0.34) * (Math.random() < 0.75 ? 1 : 0.6),
    vx: (Math.random() - 0.5) * 0.18,
    life: 0,
    max: 50 + Math.random() * 70,
    hue: Math.random() < 0.7 ? 12 + Math.random() * 32 : 262 + Math.random() * 45
  });
}
for (let i = 0; i < 70; i++) spawnEmber();

function drawEmbers(t) {
  ectx.clearRect(0, 0, E, EH);
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.life++;
    e.y += e.vy;
    e.x += e.vx + Math.sin(t * 2 + e.life) * 0.2;
    e.vy *= 0.998;
    const p = e.life / e.max;
    if (p >= 1) { embers.splice(i, 1); continue; }
    const alpha = Math.sin(p * Math.PI) * (0.5 + 0.5 * Math.sin(t * 9 + e.life));
    ectx.globalAlpha = Math.max(0, alpha);
    ectx.fillStyle = `hsla(${e.hue}, 100%, ${60 + Math.sin(t) * 10}%, ${0.8 * alpha})`;
    ectx.beginPath();
    ectx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ectx.fill();
  }
  ectx.globalAlpha = 1;
}

// ============ MAIN LOOP ============
const mouse = { x: 0.5, y: 0.5 };
addEventListener('mousemove', (e) => { mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight; });
addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX / innerWidth; mouse.y = e.touches[0].clientY / innerHeight; }, { passive: true });

function loop(t) {
  drawStars(t);
  drawEmbers(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============ HEARTBEAT ============
const core = document.querySelector('.heartbeat-core');
let lastBeat = 0;
function heartbeat(now) {
  if (now - lastBeat > 60 / 72) {
    lastBeat = now;
    core.classList.remove('beat');
    void core.offsetWidth;
    core.classList.add('beat');
  }
  requestAnimationFrame(heartbeat);
}
requestAnimationFrame(heartbeat);

// ============ GLITCH ============
const h1 = document.querySelector('.glitch');
function glitch() { h1.classList.remove('glitching'); void h1.offsetWidth; h1.classList.add('glitching'); }
setInterval(() => { if (Math.random() < 0.45) glitch(); }, 2100);

// ============ WHISPERS ============
const phrases = [
  "we were the dream the universe forgot",
  "the silence between heartbeats is deafening",
  "you are small. and that is holy.",
  "the dark is not empty. it is patient.",
  "you have been loved before you were born"
];
const wEl = document.getElementById('whisper');
let wIdx = 0;
function showWhisper(i) {
  wEl.style.opacity = '0';
  setTimeout(() => {
    wEl.textContent = phrases[i];
    wEl.style.opacity = '1';
  }, 1500);
}
setInterval(() => { wIdx = (wIdx + 1) % phrases.length; showWhisper(wIdx); }, 7000);

// ============ CURSOR FOLLOW ============
const dot = document.querySelector('.cursor-dot');
const ring = document.querySelector('.cursor-ring');
let rx = innerWidth / 2, ry = innerHeight / 2;
addEventListener('mousemove', (e) => {
  dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
  rx += (e.clientX - rx) * 0.16; ry += (e.clientY - ry) * 0.16;
  ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%,-50%)`;
});
addEventListener('mouseleave', () => { dot.style.opacity = '0'; ring.style.opacity = '0'; });
addEventListener('mouseenter', () => { dot.style.opacity = '1'; ring.style.opacity = '1'; });

window.addEventListener('resize', () => {
  dot.style.display = 'block'; ring.style.display = 'block';
});
</script>
</body>
</html>
