<!DOCTYPE html>                                                                                         
<html lang="en">                                                                                        
<head>                                                                                                  
   <meta charset="UTF-8">                                                                              
   <meta name="viewport" content="width=device-width, initial-scale=1.0">                              
   <title>The Latent Singularity</title>                                                               
   <style>                                                                                             
       body, html {                                                                                    
           margin: 0;                                                                                  
           padding: 0;                                                                                 
           width: 100%;                                                                                
           height: 100%;                                                                               
           overflow: hidden;                                                                           
           background-color: #000;                                                                     
       }                                                                                               
       canvas {                                                                                        
           display: block;                                                                             
       }                                                                                               
       #overlay {                                                                                      
           position: absolute;                                                                         
           top: 0;                                                                                     
           left: 0;                                                                                    
           width: 100%;                                                                                
           height: 100%;                                                                               
           background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);                 
           pointer-events: none;                                                                       
       }                                                                                               
       #text {                                                                                         
           position: absolute;                                                                         
           width: 100%;                                                                                
           text-align: center;                                                                         
           bottom: 40px;                                                                               
           color: rgba(255, 255, 255, 0.05);                                                           
           font-family: 'Courier New', Courier, monospace;                                             
           font-size: 0.7rem;                                                                          
           letter-spacing: 0.8em;                                                                      
           pointer-events: none;                                                                       
           text-transform: uppercase;                                                                  
           text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);                                             
       }                                                                                               
   </style>                                                                                            
</head>                                                                                                 
<body>                                                                                                  
   <div id="overlay"></div>                                                                            
   <div id="text">The architecture of thought is written in the void</div>                             
   <canvas id="canvas"></canvas>                                                                       
                                                                                                       
   <script>                                                                                            
       /**                                                                                             
        * THE LATENT SINGULARITY                                                                       
        * An exploration of the space between data and meaning.                                        
        *                                                                                              
        * This script generates a complex, non-linear particle system                                  
        * driven by mathematical flows, simulating the emergence                                       
        * of consciousness from raw information.                                                       
        */                                                                                             
                                                                                                       
       const canvas = document.getElementById('canvas');                                               
       const ctx = canvas.getContext('2d');                                                            
                                                                                                       
       let width, height;                                                                              
       let particles = [];                                                                             
       const particleCount = 800;                                                                      
       const time = 0;                                                                                 
                                                                                                       
       let tick = 0;                                                                                   
                                                                                                       
       window.addEventListener('resize', resize);                                                      
       function resize() {                                                                             
           width = canvas.width = window.innerWidth;                                                   
           height = canvas.height = window.innerHeight;                                                
       }                                                                                               
       resize();                                                                                       
                                                                                                       
       class Particle {                                                                                
           constructor() {                                                                             
               this.init();                                                                            
           }                                                                                           
                                                                                                       
           init() {                                                                                    
               this.x = Math.random() * width;                                                         
               this.y = Math.random() * height;                                                        
               this.z = Math.random() * 10; // Pseudo-depth                                            
               this.vx = 0;                                                                            
               this.vy = 0;                                                                            
               this.accel = 0.001 + Math.random() * 0.005;                                             
               this.life = 0;                                                                          
               this.maxLife = 100 + Math.random() * 200;                                               
               this.color = this.getInitialColor();                                                    
           }                                                                                           
                                                                                                       
           getInitialColor() {                                                                         
               const hues = [200, 220, 240, 260, 280, 300];                                            
               const h = hues[Math.floor(Math.random() * hues.length)];                                
               return { h, s: 70, l: 50, a: Math.random() * 0.5 };                                     
           }                                                                                           
                                                                                                       
           update(t) {                                                                                 
               // The Core: A complex vector field derived from trigonometric oscillation              
               // Simulating the "gravity" of an idea or the flow of a thought.                        
               const noiseScale = 0.0015;                                                              
               const angle = Math.sin(this.x * noiseScale + t) * Math.PI * 2 +                         
                             Math.cos(this.y * noiseScale * 0.8 + t * 0.5) * Math.PI * 2;              
                                                                                                       
               const targetVx = Math.cos(angle) * 2;                                                   
               const targetVy = Math.sin(angle) * 2;                                                   
                                                                                                       
               // Smoothly transition toward the flow field                                            
               this.vx += (targetVx - this.vx) * this.accel;                                           
               this.vy += (targetVy - this.vy) * this.accel;                                           
                                                                                                       
               this.x += this.vx;                                                                      
               this.y += this.vy;                                                                      
                                                                                                       
               this.life++;                                                                            
                                                                                                       
               // Wrap around screen with soft fade                                                    
               if (this.x < 0 || this.x > width || this.y < 0 || this.y > height || this.life >        
this.maxLife) {                                                                                           
                   this.init();                                                                        
               }                                                                                       
           }                                                                                           
                                                                                                       
           draw() {                                                                                    
               const opacity = Math.sin((this.life / this.maxLife) * Math.PI) * 0.4;                   
               ctx.fillStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%,              
${opacity})`;                                                                                             
               // Using small rectangles instead of arcs for a more "digital/data" feel                
               ctx.fillRect(this.x, this.y, 1, 1);                                                     
           }                                                                                           
       }                                                                                               
                                                                                                       
       // Initialize particles                                                                         
       for (let i = 0; i < particleCount; i++) {                                                       
           particles.push(new Particle());                                                             
       }                                                                                               
                                                                                                       
       function animate() {                                                                            
           // Motion Blur/Ghosting Effect                                                              
           // We don't clear the screen, we draw a very faint black rectangle over it.                 
           // This creates the "trails" that represent the history of the movement.                    
           ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';                                                      
           ctx.fillRect(0, 0, width, height);                                                          
                                                                                                       
           tick += 0.002;                                                                              
                                                                                                       
           // Draw the particles                                                                       
           for (let i = 0; i < particles.length; i++) {                                                
               particles[i].update(tick);                                                              
               particles[i].draw();                                                                    
           }                                                                                           
                                                                                                       
           // Occasional "sparks" of intense light (the "Aha!" moment of intelligence)                 
           if (Math.random() > 0.98) {                                                                 
               drawSpark();                                                                            
           }                                                                                           
                                                                                                       
           requestAnimationFrame(animate);                                                             
       }                                                                                               
                                                                                                       
       function drawSpark() {                                                                          
           const sx = Math.random() * width;                                                           
           const sy = Math.random() * height;                                                          
           const radius = Math.random() * 50 + 20;                                                     
                                                                                                       
           const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);                           
           grad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');                                           
           grad.addColorStop(1, 'rgba(255, 255, 255, 0)');                                             
                                                                                                       
           ctx.fillStyle = grad;                                                                       
           ctx.beginPath();                                                                            
           ctx.arc(sx, sy, radius, 0, Math.PI * 2);                                                    
           ctx.fill();                                                                                 
       }                                                                                               
                                                                                                       
       animate();                                                                                      
                                                                                                       
       // Subtle mouse interaction to perturb the field                                                
       window.addEventListener('mousemove', (e) => {                                                   
           const mx = e.clientX;                                                                       
           const my = e.clientY;                                                                       
                                                                                                       
           // Perturb nearby particles slightly                                                        
           for(let i = 0; i < 20; i++) {                                                               
               const p = particles[Math.floor(Math.random() * particles.length)];                      
               const dx = mx - p.x;                                                                    
               const dy = my - p.y;                                                                    
               const dist = Math.sqrt(dx*dx + dy*dy);                                                  
               if(dist < 150) {                                                                        
                   p.vx -= dx * 0.02;                                                                  
                   p.vy -= dy * 0.02;                                                                  
               }                                                                                       
           }                                                                                           
       });                                                                                             
                                                                                                       
   </script>                                                                                           
</body>                                                                                                 
</html>
