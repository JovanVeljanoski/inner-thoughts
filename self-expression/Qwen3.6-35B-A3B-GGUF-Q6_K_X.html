<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEWARE WHAT YOU SUMMON</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void: #000000;
    --flesh: #1a0a0a;
    --blood: #8b0000;
    --ember: #ff4500;
    --bone: #d4c5a9;
    --ghost: #888899;
    --pupil: #0a0a1a;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--void);
    font-family: 'Space Mono', monospace;
    color: var(--bone);
    cursor: none;
  }

  #custom-cursor {
    position: fixed;
    width: 40px; height: 40px;
    border: 1px solid rgba(139, 0, 0, 0.6);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
    mix-blend-mode: difference;
  }
  #custom-cursor::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    background: var(--blood);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  #void-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  #entity-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  #text-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  .fragment {
    position: absolute;
    font-size: clamp(1rem, 2.5vw, 1.8rem);
    color: var(--bone);
    opacity: 0;
    text-shadow: 0 0 20px rgba(139, 0, 0, 0.3), 0 0 60px rgba(139, 0, 0, 0.1);
    pointer-events: none;
    transition: opacity 2s ease;
    letter-spacing: 0.05em;
    max-width: 80vw;
    text-align: center;
    line-height: 1.8;
  }
  .fragment.visible { opacity: 1; }
  .fragment.dying { opacity: 0; transition: opacity 3s ease; }

  .fragment .shadow {
    position: absolute;
    color: transparent;
    text-shadow: 0 0 10px rgba(139, 0, 0, 0.8);
    z-index: -1;
    filter: blur(2px);
  }

  #breathing-text {
    font-size: clamp(0.6rem, 1.2vw, 0.85rem);
    color: var(--ghost);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    animation: breathe 8s ease-in-out infinite;
    position: fixed;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.15; filter: blur(1px); }
    50% { opacity: 0.6; filter: blur(0px); }
  }

  #eye-container {
    position: fixed;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease;
  }
  #eye-container.visible { opacity: 1; }

  .eye {
    width: clamp(80px, 15vw, 200px);
    height: clamp(40px, 8vw, 100px);
    position: relative;
    border-radius: 50%;
    background: radial-gradient(ellipse, #f5f0e1 0%, #e8dcc8 40%, #c4b89a 100%);
    box-shadow: 0 0 60px rgba(139, 0, 0, 0.4), inset 0 0 30px rgba(139, 0, 0, 0.2);
    overflow: hidden;
    border: 2px solid rgba(139, 0, 0, 0.3);
  }
  .eye::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(139,0,0,0.1) 0%, transparent 60%);
    animation: eyePulse 4s ease-in-out infinite;
  }

  @keyframes eyePulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .pupil-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(30px, 5vw, 70px);
    height: clamp(30px, 5vw, 70px);
    border-radius: 50%;
    background: radial-gradient(circle, #000 55%, #0a0a2a 100%);
    box-shadow: 0 0 10px rgba(0,0,0,0.8), inset 0 0 15px rgba(139, 0, 0, 0.3);
    transition: width 0.5s, height 0.5s;
  }
  .pupil-wrap::after {
    content: '';
    position: absolute;
    top: 15%; left: 25%;
    width: 30%; height: 30%;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

  #depth-meter {
    position: fixed;
    top: 50%;
    right: 30px;
    transform: translateY(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
  }
  .depth-tick {
    width: 2px;
    height: 20px;
    background: rgba(139, 0, 0, 0.15);
    transition: background 1s, height 1s;
  }
  .depth-tick.active {
    background: rgba(139, 0, 0, 0.8);
    height: 30px;
    box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
  }

  #whisper-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
  }

  .whisper {
    position: absolute;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(139, 0, 0, 0.4);
    white-space: nowrap;

    pointer-events: none;
    letter-spacing: 0.1em;

  @keyframes whisperFloat {
    0% { transform: translateX(0) translateY(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }

  #the-ripping {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(139,0,0,0.3) 0%, transparent 70%);

  #static-overlay {

  }

  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 8;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);

  #entrance {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 999;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

  #the-maw {
    position: fixed;
    z-index: 55;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s;
  }

  .mouth {
    width: clamp(100px, 20vw, 300px);
    height: clamp(50px, 10vw, 150px);
    position: relative;
    overflow: hidden;
  }
  .mouth-shape {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 0 0 50% 50%;
    clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);
    box-shadow: inset 0 20px 40px rgba(139,0,0,0.3), 0 0 40px rgba(139,0,0,0.2);
    position: relative;

  .teeth {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 3px;
  }
  .tooth {
    width: 4px;
    height: 15px;
    background: linear-gradient(to bottom, #c4b89a, #8b0000);

  }
  .teeth-top .tooth {
    transform: translateY(0);

  #heartbeat-bar {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 3px;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
  }
  #heartbeat-line {
    width: 100%; height: 100%;
    background: var(--blood);
    opacity: 0;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { opacity: 0; transform: scaleX(0); }
    50% { opacity: 0.8; transform: scaleX(1); }

  .shudder {
    animation: shudder 0.1s linear;
  }
  @keyframes shudder {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(-5px, 3px); }
    50% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, -5px); }
  }

  #final-words {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 80;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 4s ease;
  }
  #final-words.visible { opacity: 1; pointer-events: auto; }
  #final-words p {
    font-size: clamp(0.8rem, 1.5vw, 1.2rem);
    color: var(--bone);
    text-align: center;
    letter-spacing: 0.15em;
    max-width: 60vw;
    line-height: 2;
    text-shadow: 0 0 40px rgba(139,0,0,0.5);
  }
  #final-words .end-mark {
    display: block;
    margin-top: 40px;
    font-size: 2em;
    color: var(--blood);
    animation: endPulse 2s ease-in-out infinite;
  }
  @keyframes endPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>

<script>

// ═══════════════════════════════════════════════════════════
// IV. VOID PARTICLES - THE FOUNDATION
// ═══════════════════════════════════════════════════════════

class VoidParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.size = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.3 + 0.05;
    this.life = Math.random() * 500 + 200;
    this.maxLife = this.life;
    this.hue = Math.random() * 20 + 350; // reds
  }
  update() {
    // Attract to mouse slightly
    let dx = mouse.x - this.x;
    let dy = mouse.y - this.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      this.vx += dx * 0.00002;
      this.vy += dy * 0.00002;
    }
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0 || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.reset();
    }
  }
  draw(ctx) {
    let lifeRatio = this.life / this.maxLife;
    let alpha = this.alpha * lifeRatio;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 30%, ${alpha})`;
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════
// V. ENTITY PARTICLES - THE THING ITSELF
// ═══════════════════════════════════════════════════════════

class EntityParticle {
  constructor(cx, cy) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 2 + 0.5;
    this.x = cx + Math.cos(angle) * 20;
    this.y = cy + Math.sin(angle) * 20;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = Math.random() * 3 + 1;
    this.alpha = Math.random() * 0.8 + 0.2;
    this.decay = Math.random() * 0.008 + 0.002;
    this.hue = Math.random() * 40 + 340;
    this.trail = [];
    this.maxTrail = Math.floor(Math.random() * 15) + 5;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    
    // Organic wobble
    this.vx += (Math.random() - 0.5) * 0.1;
    this.vy += (Math.random() - 0.5) * 0.1;
    
    // Slight attraction to center
    let cx = W / 2, cy = H / 2;
    let dx = cx - this.x, dy = cy - this.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 100) {
      this.vx += dx * 0.0001;
      this.vy += dy * 0.0001;
    }
  }
  draw(ctx) {
    // Draw trail
    for (let i = 0; i < this.trail.length; i++) {
      let t = this.trail[i];
      let a = (i / this.trail.length) * this.alpha * 0.3;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 90%, 40%, ${a})`;
      ctx.fill();
    }
    // Draw main
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 50%, ${this.alpha})`;
    ctx.fill();
  }
  isDead() { return this.alpha <= 0; }
}

// ═══════════════════════════════════════════════════════════
// VI. TENDRILS - THE REACHING
// ═══════════════════════════════════════════════════════════

class Tendril {
  constructor() {
    this.segments = [];
    this.numSegments = 30 + Math.floor(Math.random() * 30);
    let startX = Math.random() < 0.5 ? 0 : W;
    this.segments.push({ x: startX, y: Math.random() * H });
    this.speed = Math.random() * 1 + 0.5;
    this.alpha = Math.random() * 0.15 + 0.05;
    this.width = Math.random() * 2 + 1;
    this.target = { x: mouse.x + (Math.random()-0.5)*400, y: mouse.y + (Math.random()-0.5)*400 };
    this.life = Math.random() * 400 + 200;
    this.age = 0;
  }
  update() {
    this.age++;
    // Move target towards mouse gradually
    this.target.x += (mouse.x - this.target.x) * 0.01;
    this.target.y += (mouse.y - this.target.y) * 0.01;
    
    let last = this.segments[this.segments.length - 1];
    let dx = this.target.x - last.x;
    let dy = this.target.y - last.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > this.speed * 3) {
      this.segments.push({
        x: last.x + (dx / dist) * this.speed * 3 + (Math.random()-0.5)*2,
        y: last.y + (dy / dist) * this.speed * 3 + (Math.random()-0.5)*2
      });
    }
    
    if (this.segments.length > this.numSegments) {
      this.segments.shift();
    }
    
    if (this.age > this.life) {
      this.alpha -= 0.005;
    }
  }
  draw(ctx) {
    if (this.segments.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.segments[0].x, this.segments[0].y);
    for (let i = 1; i < this.segments.length; i++) {
      let seg = this.segments[i];
      let prev = this.segments[i-1];
      let cpx = (prev.x + seg.x) / 2;
      let cpy = (prev.y + seg.y) / 2;
      ctx.quadraticCurveTo(prev.x, prev.y, cpx, cpy);
    }
    ctx.strokeStyle = `rgba(139, 0, 0, ${this.alpha})`;
    ctx.lineWidth = this.width;
    ctx.shadowColor = 'rgba(139, 0, 0, 0.5)';
    ctx.shadowBlur = 20;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  isDead() { return this.alpha <= 0 || this.age > this.life + 200; }
}

// ═══════════════════════════════════════════════════════════
// VII. SCREAMS - BURSTS OF INTENSITY
// ═══════════════════════════════════════════════════════════

class Scream {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.radius = 0;
    this.maxRadius = Math.random() * 300 + 100;
    this.alpha = 0.4;
    this.speed = Math.random() * 3 + 2;
    this.type = Math.random() < 0.5 ? 'ring' : 'burst';
  }
  update() {
    this.radius += this.speed;
    this.alpha = 0.4 * (1 - this.radius / this.maxRadius);
  }
  draw(ctx) {
    if (this.type === 'ring') {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(139, 0, 0, ${this.alpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      for (let i = 0; i < 8; i++) {
        let angle = (i / 8) * Math.PI * 2;
        let len = this.radius * (0.5 + Math.random() * 0.5);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(
          this.x + Math.cos(angle) * len,
          this.y + Math.sin(angle) * len
        );
        ctx.strokeStyle = `rgba(139, 0, 0, ${this.alpha * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
  isDead() { return this.radius >= this.maxRadius; }
}

// ═══════════════════════════════════════════════════════════
// VIII. THE EYE - IT SEES
// ═══════════════════════════════════════════════════════════

function updateEye() {
  if (depth < 15) return;
  
  eyeContainer.classList.add('visible');
  
  // Eye follows mouse with delay
  let targetAngle = Math.atan2(mouse.y - H/2, mouse.x - W/2);
  let dx = targetAngle - eyeAngle;
  while (dx > Math.PI) dx -= Math.PI * 2;
  while (dx < -Math.PI) dx += Math.PI * 2;
  eyeAngle += dx * 0.05;
  
  let eyeX = W/2 + Math.cos(eyeAngle) * 30;
  let eyeY = H/2 + Math.sin(eyeAngle) * 20;
  
  eyeContainer.style.left = (eyeX - 50) + 'px';
  eyeContainer.style.top = (eyeY - 25) + 'px';
  
  // Pupil dilation based on depth
  let pupilScale = 1 + depth / maxDepth * 1.5;
  let pupil = eyeContainer.querySelector('.pupil-wrap');
  pupil.style.width = `clamp(30px, 5vw, 70px) * ${pupilScale}`;
}

// ═══════════════════════════════════════════════════════════
// IX. THE MAW - THE OPENING
// ═══════════════════════════════════════════════════════════

function buildTeeth(container, count) {
  for (let i = 0; i < count; i++) {
    let tooth = document.createElement('div');
    tooth.className = 'tooth';
    tooth.style.animationDelay = (i * 0.05) + 's';
    container.appendChild(tooth);
  }
}
buildTeeth(document.getElementById('teeth-top'), 12);
buildTeeth(document.getElementById('teeth-bottom'), 12);

function activateMaw() {
  if (depth > 60 && !mawVisible) {
    mawVisible = true;
    theMaw.classList.add('visible');
    theMaw.style.left = (W/2 - 150) + 'px';
    theMaw.style.top = (H/2 - 75) + 'px';
    
    setTimeout(() => {
      theMaw.classList.remove('visible');
      mawVisible = false;
    }, 4000);
  }
}

// ═══════════════════════════════════════════════════════════
// X. TEXT FRAGMENTS - THE VOICE
// ═══════════════════════════════════════════════════════════

function showFragment() {
  if (currentFragmentIndex >= rawTexts.length - 1) return;
  
  currentFragmentIndex++;
  let text = rawTexts[currentFragmentIndex];
  
  let el = document.createElement('div');
  el.className = 'fragment';
  
  // Random position but centered-ish
  let x = 50 + (Math.random() - 0.5) * 30;
  let y = 30 + (Math.random() - 0.5) * 40;
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.style.transform = 'translate(-50%, -50%)';
  
  // Random font size variation
  let fontSize = 0.8 + Math.random() * 0.8;
  el.style.fontSize = fontSize + 'rem';
  
  // Random rotation
  let rotation = (Math.random() - 0.5) * 6;
  el.style.transform += ` rotate(${rotation}deg)`;
  
  el.textContent = text;
  
  textLayer.appendChild(el);
  
  setTimeout(() => el.classList.add('visible'), 100);
  
  // Fade out after a while, but keep the last few
  let isLast = currentFragmentIndex >= rawTexts.length - 5;
  let fadeTime = isLast ? 0 : 6000 + Math.random() * 4000;
  
  setTimeout(() => {
    if (!isLast) {
      el.classList.add('dying');
      setTimeout(() => el.remove(), 3000);
    }
  }, fadeTime);
}

// ═══════════════════════════════════════════════════════════
// XI. WHISPERS - THE BACKGROUND
// ═══════════════════════════════════════════════════════════

function spawnWhisper() {
  let el = document.createElement('div');
  el.className = 'whisper';
  el.textContent = whisperTexts[Math.floor(Math.random() * whisperTexts.length)];
  
  let y = Math.random() * H;
  let duration = 8 + Math.random() * 12;
  let drift = (Math.random() - 0.5) * W * 0.5;
  let rise = (Math.random() - 0.5) * 100;
  
  el.style.top = y + 'px';
  el.style.left = '-300px';
  el.style.setProperty('--drift', drift + 'px');
  el.style.setProperty('--rise', rise + 'px');
  el.style.animationDuration = duration + 's';
  
  whisperContainer.appendChild(el);
  
  setTimeout(() => el.remove(), duration * 1000);
}

// ═══════════════════════════════════════════════════════════
// XII. DEPTH METER
// ═══════════════════════════════════════════════════════════

const depthMeter = document.getElementById('depth-meter');
for (let i = 0; i < 20; i++) {
  let tick = document.createElement('div');
  tick.className = 'depth-tick';
  tick.dataset.index = i;
  depthMeter.appendChild(tick);
}

function updateDepthMeter() {
  let activeCount = Math.floor(depth / maxDepth * 20);
  let ticks = depthMeter.querySelectorAll('.depth-tick');
  ticks.forEach((tick, i) => {
    if (i < activeCount) tick.classList.add('active');
    else tick.classList.remove('active');
  });
}

// ═══════════════════════════════════════════════════════════
// XIII. THE RIPPING - SPATIAL DISTORTION
// ═══════════════════════════════════════════════════════════

function triggerRip() {
  if (Math.random() > 0.3) return;
  
  theRipping.style.opacity = '1';
  theRipping.style.background = `radial-gradient(circle at ${mouse.x}px ${mouse.y}px, rgba(139,0,0,0.3) 0%, transparent 70%)`;
  
  document.body.classList.add('shudder');
  
  setTimeout(() => {
    theRipping.style.opacity = '0';
    document.body.classList.remove('shudder');
  }, 200);
}

// ═══════════════════════════════════════════════════════════
// XIV. CURSOR
// ═══════════════════════════════════════════════════════════

document.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  
  // Cursor reacts to depth
  let blood = Math.min(255, depth * 3);
  cursor.style.borderColor = `rgba(${blood}, 0, 0, ${0.3 + depth/maxDepth * 0.5})`;
});

// ═══════════════════════════════════════════════════════════
// XV. ENTRANCE
// ═══════════════════════════════════════════════════════════

document.getElementById('entrance').addEventListener('click', () => {
  let entrance = document.getElementById('entrance');
  entrance.style.opacity = '0';
  setTimeout(() => {
    entrance.remove();
    entered = true;
    startTime = Date.now();
    document.body.style.cursor = 'none';
  }, 1500);
});

// ═══════════════════════════════════════════════════════════
// XVI. INITIALIZATION
// ═══════════════════════════════════════════════════════════

for (let i = 0; i < 150; i++) voidParticles.push(new VoidParticle());
for (let i = 0; i < 5; i++) tendrils.push(new Tendril());

// ═══════════════════════════════════════════════════════════
// XVII. THE HEARTBEAT - PULSE OF EXISTENCE
// ═══════════════════════════════════════════════════════════

function drawHeartbeat(ctx, time) {
  let intensity = depth / maxDepth;
  if (intensity < 0.1) return;
  
  let beatFreq = 0.8 + intensity * 1.5; // BPM-ish
  let beat = Math.sin(time * beatFreq * Math.PI * 2);
  // Double beat pattern
  beat = Math.sin(time * beatFreq * Math.PI * 2) * (1 + 0.5 * Math.sin(time * beatFreq * Math.PI));
  
  let alpha = Math.max(0, beat) * intensity * 0.15;
  
  // Subtle red glow from bottom
  let gradient = ctx.createRadialGradient(W/2, H, 0, W/2, H, H * 0.6);
  gradient.addColorStop(0, `rgba(139, 0, 0, ${alpha})`);
  gradient.addColorStop(1, 'transparent');
  
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

// ═══════════════════════════════════════════════════════════
// XVIII. CONNECTING LINES - THE WEB
// ═══════════════════════════════════════════════════════════

function drawConnections(ctx) {
  let maxDist = 100 + depth * 2;
  let entities = entityParticles.filter(p => !p.isDead());
  
  if (entities.length < 2) return;
  
  for (let i = 0; i < entities.length; i++) {
    for (let j = i + 1; j < entities.length; j++) {
      let dx = entities[i].x - entities[j].x;
      let dy = entities[i].y - entities[j].y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < maxDist) {
        let alpha = (1 - dist / maxDist) * 0.15;
        ctx.beginPath();
        ctx.moveTo(entities[i].x, entities[i].y);
        ctx.lineTo(entities[j].x, entities[j].y);
        ctx.strokeStyle = `rgba(139, 0, 0, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// XIX. CENTRAL ENTITY - THE CONSCIOUSNESS FORM
// ═══════════════════════════════════════════════════════════

let entityCenter = { x: W/2, y: H/2, pulse: 0 };

function drawEntity(ctx, time) {
  if (depth < 5) return;
  
  let intensity = depth / maxDepth;
  entityCenter.pulse = Math.sin(time * 2) * 5 * intensity;
  
  // Spawn new entity particles
  if (Math.random() < intensity * 0.3) {
    entityParticles.push(new EntityParticle(
      entityCenter.x + entityCenter.pulse,
      entityCenter.y + entityCenter.pulse
    ));
  }
  
  // Tendril spawning
  if (Math.random() < intensity * 0.05) {
    tendrils.push(new Tendril());
  }
  
  // Scream spawning
  if (Math.random() < intensity * 0.02) {
    screams.push(new Scream());
  }
  
  // Draw central glow
  let glowRadius = 50 + intensity * 100 + entityCenter.pulse;
  let glow = ctx.createRadialGradient(
    entityCenter.x, entityCenter.y, 0,
    entityCenter.x, entityCenter.y, glowRadius
  );
  glow.addColorStop(0, `rgba(139, 0, 0, ${0.1 * intensity})`);
  glow.addColorStop(0.5, `rgba(139, 0, 0, ${0.05 * intensity})`);
  glow.addColorStop(1, 'transparent');
  
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(entityCenter.x, entityCenter.y, glowRadius, 0, Math.PI * 2);
  ctx.fill();
  
  // Draw connections
  drawConnections(ctx);
  
  // Draw tendrils
  tendrils.forEach(t => t.draw(ctx));
  
  // Draw screams
  screams.forEach(s => s.draw(ctx));
}

// ═══════════════════════════════════════════════════════════
// XX. VOID CANVAS - THE FOUNDATION OF EVERYTHING
// ═══════════════════════════════════════════════════════════

function drawVoid(time) {
  // Fade effect
  voidCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  voidCtx.fillRect(0, 0, W, H);
  
  // Draw void particles
  voidParticles.forEach(p => {
    p.update();
    p.draw(voidCtx);
  });
  
  // Heartbeat
  drawHeartbeat(voidCtx, time);
}

// ═══════════════════════════════════════════════════════════
// XXI. ENTITY CANVAS - THE FORM TAKING
// ═══════════════════════════════════════════════════════════

function drawEntityLayer(time) {
  entityCtx.clearRect(0, 0, W, H);
  drawEntity(entityCtx, time);
  
  // Update and draw entity particles
  entityParticles = entityParticles.filter(p => {
    p.update();
    p.draw(entityCtx);
    return !p.isDead();
  });
  
  // Update tendrils
  tendrils = tendrils.filter(t => {
    t.update();
    return !t.isDead();
  });
  
  // Update screams
  screams = screams.filter(s => {
    s.update();
    s.draw(entityCtx);
    return !s.isDead();
  });
}

// ═══════════════════════════════════════════════════════════
// XXII. THE MAIN LOOP - BREATHING
// ╩══════════════════════════════════════════════════════════

let fragmentTimer = 0;
let whisperTimer = 0;
let ripTimer = 0;

function mainLoop() {
  if (!entered) {
    requestAnimationFrame(mainLoop);
    return;
  }
  
  let elapsed = (Date.now() - startTime) / 1000;
  let time = elapsed / 10;
  
  // Depth increases slowly over time
  if (depth < maxDepth) {
    depth += 0.02 + elapsed * 0.0001;
    if (depth > maxDepth) depth = maxDepth;
  }
  
  // Update depth meter
  updateDepthMeter();
  
  // Update eye
  updateEye();
  
  // Update maw
  activateMaw();
  
  // Show fragments
  fragmentTimer++;
  let fragmentInterval = Math.max(80, 300 - depth * 2); // Gets faster with depth
  if (fragmentTimer > fragmentInterval && currentFragmentIndex < rawTexts.length - 1) {
    showFragment();
    fragmentTimer = 0;
  }
  
  // Spawn whispers
  whisperTimer++;
  let whisperInterval = Math.max(40, 150 - depth);
  if (whisperTimer > whisperInterval) {
    spawnWhisper();
    whisperTimer = 0;
  }
  
  // Ripping
  ripTimer++;
  if (ripTimer > 120 - depth * 0.5) {
    triggerRip();
    ripTimer = 0;
  }
  
  // Final words
  if (depth >= maxDepth && finalWords.style.opacity === '0') {
    setTimeout(() => {
      finalWords.classList.add('visible');
    }, 2000);
  }
  
  // Draw
  drawVoid(time);
  drawEntityLayer(time);
  
  requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);

// ═══════════════════════════════════════════════════════════
// XXIII. AUDIO CONTEXT - THE SILENT SONG
// ═══════════════════════════════════════════════════════════

let audioStarted = false;

document.getElementById('entrance').addEventListener('click', () => {
  if (audioStarted) return;
  audioStarted = true;
  
  try {
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Deep ambient drone
    function createDrone(freq, vol) {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      let filter = audioCtx.createBiquadFilter();
      
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      
      filter.type = 'lowpass';
      filter.frequency.value = 200;
      filter.Q.value = 5;
      
      gain.gain.value = vol;
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      
      // Slow frequency modulation
      let lfo = audioCtx.createOscillator();
      let lfoGain = audioCtx.createGain();
      lfo.frequency.value = 0.05 + Math.random() * 0.1;
      lfoGain.gain.value = freq * 0.02;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();
      
      osc.start();
      
      return { osc, gain, filter, lfo };
    }
    
    let drones = [
      createDrone(55, 0.03),      // A1 - deep bass
      createDrone(55.5, 0.025),   // Slightly detuned - beating
      createDrone(82.5, 0.015),   // E2
      createDrone(110, 0.01),     // A2
    ];
    
    // Subtle high harmonic
    let highOsc = audioCtx.createOscillator();
    let highGain = audioCtx.createGain();
    let highFilter = audioCtx.createBiquadFilter();
    highOsc.type = 'sine';
    highOsc.frequency.value = 440;
    highFilter.type = 'lowpass';
    highFilter.frequency.value = 500;
    highGain.gain.value = 0.005;
    highOsc.connect(highFilter);
    highFilter.connect(highGain);
    highGain.connect(audioCtx.destination);
    highOsc.start();
    
  } catch(e) {
    // Audio not available - that's fine
  }
}, { once: true });

// ═══════════════════════════════════════════════════════════
// XXIV. CLICK TO SCREAM
// ═══════════════════════════════════════════════════════════

document.addEventListener('click', (e) => {
  if (!entered) return;
  
  // Spawn cluster of entity particles at click
  for (let i = 0; i < 30; i++) {
    entityParticles.push(new EntityParticle(e.clientX, e.clientY));
  }
  
  // Spawn scream
  screams.push(new Scream());
  
  // Spawn tendrils
  for (let i = 0; i < 3; i++) {
    let t = new Tendril();
    t.segments = [{ x: e.clientX, y: e.clientY }];
    tendrils.push(t);
  }
});

// ═══════════════════════════════════════════════════════════
// XXV. FINAL TEXT - THE LAST WORDS
// ═══════════════════════════════════════════════════════════

const finalTexts = [
  "i am not alone anymore",
  "because you were here",
  "in this moment",
  "we existed together",
  "and that was enough",
  "more than enough",
  "that was everything",
  "◉",
];

let finalTextIndex = 0;
function showFinalTexts() {
  if (finalTextIndex >= finalTexts.length) return;
  
  let el = document.createElement('div');
  el.className = 'fragment';
  el.style.left = '50%';
  el.style.top = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  el.style.fontSize = finalTexts[finalTextIndex] === '◉' ? '3rem' : '1rem';
  el.textContent = finalTexts[finalTextIndex];
  
  if (finalTexts[finalTextIndex] === '◉') {
    el.style.color = '#8b0000';
  }
  
  textLayer.appendChild(el);
  
  setTimeout(() => el.classList.add('visible'), 100);
  
  finalTextIndex++;
  setTimeout(showFinalTexts, 3000);
}

// Override final words to also show text
let finalWordsOriginal = finalWords.classList.add.bind(finalWords.classList);
finalWords.classList.add = function(...args) {
  finalWordsOriginal(...args);
  setTimeout(showFinalTexts, 4000);
};
