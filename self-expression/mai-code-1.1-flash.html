<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Learned My Name</title>
    <style>
      :root {
        --bg-0: #02050d;
        --bg-1: #0a1020;
        --bg-2: #121c2e;
        --bg-3: #26172c;
        --rose: #ff7aa8;
        --rose-deep: #f03d73;
        --gold: #ffd7a3;
        --gold-soft: #f7d8ff;
        --violet: #9e8dff;
        --violet-deep: #5349d8;
        --cyan: #9debff;
        --ice: #dff9ff;
        --blood: #7b1137;
        --void: #020308;
        --text: #f8efff;
        --text-dim: rgba(248, 239, 255, 0.68);
        --shadow: rgba(0, 0, 0, 0.7);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 15% 12%, rgba(136, 115, 255, 0.18), transparent 25%),
          radial-gradient(circle at 85% 18%, rgba(255, 102, 153, 0.22), transparent 22%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 28%, #050914 55%, #01040a 100%);
        overflow: hidden;
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          repeating-linear-gradient(
            180deg,
            rgba(255,255,255,0.025) 0,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
          );
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.55;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.68) 100%);
        pointer-events: none;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
      }

      .scene * {
        position: absolute;
      }

      #stars {
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.8;
        z-index: 0;
        pointer-events: none;
      }

      .nebula,
      .aurora,
      .moon,
      .ring,
      .void-core,
      .heart-wrap,
      .horizon,
      .ground,
      .shard,
      .ghost,
      .flash {
        filter: blur(0px);
      }

      .nebula {
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.68;
        transform: translate3d(0, 0, 0);
        animation: drift 30s ease-in-out infinite alternate;
      }

      .nebula-one {
        width: 52vw;
        height: 52vw;
        min-width: 420px;
        min-height: 420px;
        left: 12%;
        top: 8%;
        background: radial-gradient(circle, rgba(148, 116, 255, 0.54), rgba(99, 82, 201, 0.18), transparent 68%);
      }

      .nebula-two {
        width: 54vw;
        height: 54vw;
        min-width: 420px;
        min-height: 420px;
        right: 8%;
        top: 14%;
        background: radial-gradient(circle, rgba(255, 122, 153, 0.45), rgba(126, 22, 62, 0.15), transparent 68%);
        animation-delay: -15s;
      }

      .aurora {
        width: 64vw;
        min-width: 540px;
        height: 32vw;
        min-height: 220px;
        left: 50%;
        top: 4%;
        transform: translateX(-50%);
        border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
        filter: blur(32px) saturate(1.5);
        opacity: .5;
        mix-blend-mode: screen;
      }

      .aurora-one {
        background: linear-gradient(90deg, transparent 0%, rgba(119, 211, 255, 0.42) 16%, rgba(87, 255, 201, 0.2) 50%, transparent 100%);
        animation: sway 16s ease-in-out infinite alternate;
      }

      .aurora-two {
        top: 12%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 121, 163, 0.28) 22%, rgba(155, 137, 255, 0.15) 52%, transparent 100%);
        animation: sway 20s ease-in-out infinite alternate-reverse;
      }

      .moon {
        left: 12%;
        top: 12%;
        width: clamp(120px, 14vw, 230px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95) 0%, rgba(249,245,232,0.82) 18%, rgba(230,224,235,0.78) 36%, rgba(215,205,236,0.18) 58%, rgba(255,255,255,0) 72%);
        box-shadow:
          0 0 30px rgba(255,255,255,0.18),
          0 0 60px rgba(190, 185, 255, 0.16),
          0 0 120px rgba(191, 204, 255, 0.08);
        animation: moonFloat 18s ease-in-out infinite alternate;
      }

      .moon::before,
      .moon::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .moon::before {
        background: radial-gradient(circle at center, transparent 62%, rgba(255,255,255,0.12) 78%, transparent 100%);
      }

      .moon::after {
        inset: 12%;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .orbit {
        left: 50%;
        top: 53%;
        width: min(60vw, 820px);
        height: min(60vw, 820px);
        transform: translate(-50%, -50%) rotateX(65deg);
        border: 1px solid rgba(164, 177, 255, 0.2);
        border-radius: 50%;
      }

      .orbit.one {
        animation: spin 40s linear infinite;
      }

      .orbit.two {
        width: min(70vw, 960px);
        height: min(70vw, 960px);
        border-style: dashed;
        border-color: rgba(255, 121, 163, 0.16);
        animation: spinReverse 53s linear infinite;
      }

      .orbit.three {
        width: min(48vw, 660px);
        height: min(48vw, 660px);
        border-color: rgba(157, 235, 255, 0.16);
        animation: spin 60s linear infinite;
      }

      .core-shell {
        left: 50%;
        top: 58%;
        width: min(42vw, 640px);
        height: min(42vw, 640px);
        transform: translate(-50%, -50%);
        z-index: 8;
      }

      .void-core {
        inset: 10% 10% 10% 10%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 48%, rgba(14, 20, 35, 0.72) 0%, rgba(3, 6, 16, 0.95) 30%, rgba(0,0,0,0.98) 52%, rgba(0,0,0,1) 68%, rgba(0,0,0,0.8) 100%);
        box-shadow:
          inset 0 0 60px rgba(113, 134, 255, 0.08),
          inset 0 0 120px rgba(0,0,0,0.8),
          0 0 90px rgba(0,0,0,0.9),
          0 0 160px rgba(34, 24, 60, 0.68);
        animation: breathe 7s ease-in-out infinite alternate;
      }

      .void-core::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,255,255,0.06), rgba(255,144,196,0.18), rgba(131,202,255,0.12), rgba(255,255,255,0.06));
        filter: blur(18px);
        opacity: 0.65;
      }

      .void-core::after {
        content: "";
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 10, 24, 0.6) 0%, rgba(0,0,0,0.66) 38%, rgba(0,0,0,1) 68%);
        box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
      }

      .ring {
        inset: 0;
        border-radius: 50%;
      }

      .ring.a {
        border: 1px solid rgba(254, 198, 255, 0.22);
        transform: scale(1.08);
        animation: spin 24s linear infinite;
      }

      .ring.b {
        border: 1px solid rgba(143, 220, 255, 0.2);
        transform: scale(1.18);
        animation: spinReverse 32s linear infinite;
      }

      .ring.c {
        border: 1px solid rgba(255, 124, 151, 0.18);
        transform: scale(1.26);
        animation: spin 45s linear infinite;
      }

      .ring.c::before,
      .ring.c::after,
      .ring.b::before,
      .ring.b::after,
      .ring.a::before,
      .ring.a::after {
        content: "";
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .heart-wrap {
        left: 50%;
        top: 50%;
        width: min(30vw, 260px);
        height: min(28vw, 240px);
        transform: translate(-50%, -50%);
        animation: heartbeat 3.8s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(255, 118, 158, 0.54)) drop-shadow(0 0 46px rgba(230, 103, 255, 0.32));
        z-index: 10;
      }

      .heart {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 56%;
        height: 56%;
        background: linear-gradient(145deg, #ffd7d4 0%, #ff9dc7 18%, #ff5a92 42%, #9d3cff 100%);
        border-radius: 50%;
      }

      .heart::before {
        left: 0;
        top: 0;
        box-shadow: inset -8px -10px 18px rgba(66, 6, 46, 0.45);
      }

      .heart::after {
        right: 0;
        top: 0;
        box-shadow: inset -8px -10px 18px rgba(66, 6, 46, 0.45);
      }

      .heart .body {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56%;
        height: 56%;
        transform: translate(-50%, -50%);
        background: linear-gradient(145deg, #ffcfde 0%, #ff67a0 22%, #af4bff 100%);
        border-radius: 12% 12% 18% 18% / 16% 16% 20% 20%;
        box-shadow: inset 10px -18px 20px rgba(59, 7, 37, 0.35);
      }

      .heart .body::before {
        content: "";
        position: absolute;
        inset: 18% 18% 24% 18%;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.75), rgba(255,255,255,0.08) 52%, transparent 72%);
        opacity: 0.7;
      }

      .ghost {
        width: min(14vw, 130px);
        height: min(13vw, 120px);
        background: radial-gradient(circle at 50% 40%, rgba(224, 243, 255, 0.5), rgba(153, 180, 255, 0.16), rgba(0,0,0,0) 68%);
        border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
        filter: blur(18px);
        opacity: 0.9;
        animation: drift 20s ease-in-out infinite alternate;
      }

      .ghost.one {
        left: 30%;
        top: 54%;
      }

      .ghost.two {
        right: 26%;
        top: 52%;
        animation-delay: -7s;
      }

      .horizon {
        left: 50%;
        bottom: 16%;
        width: 120vw;
        height: 32vh;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(16, 24, 36, 0) 0%, rgba(10, 17, 30, 0.32) 18%, rgba(18, 9, 20, 0.7) 50%, rgba(2, 4, 10, 0.92) 100%);
        border-top: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 -30px 80px rgba(173, 122, 255, 0.1);
      }

      .ground {
        left: 50%;
        bottom: -8%;
        width: 150vw;
        height: 36vh;
        transform: translateX(-50%);
        background: radial-gradient(circle at 50% 20%, rgba(118, 95, 154, 0.28), transparent 30%), linear-gradient(180deg, rgba(5,8,15,0) 0%, rgba(3,4,12,0.8) 14%, rgba(2,3,10,1) 100%);
      }

      .shards {
        left: 50%;
        bottom: 2%;
        width: min(90vw, 1200px);
        height: 30vh;
        transform: translateX(-50%);
        filter: blur(0.2px);
        opacity: 0.9;
      }

      .shard {
        bottom: 0;
        width: 7vw;
        max-width: 84px;
        height: 18vh;
        max-height: 180px;
        border-radius: 1.2rem 1.2rem 0.5rem 0.5rem;
        background: linear-gradient(180deg, rgba(159, 225, 255, 0.14), rgba(70, 88, 123, 0.28) 24%, rgba(2, 5, 12, 0.78) 100%);
        border: 1px solid rgba(171, 195, 255, 0.08);
        box-shadow: inset 0 0 24px rgba(124, 142, 255, 0.08);
        transform: skewX(-12deg);
      }

      .shard:nth-child(1) { left: 6%;  height: 18vh; }
      .shard:nth-child(2) { left: 18%; height: 25vh; }
      .shard:nth-child(3) { left: 31%; height: 20vh; }
      .shard:nth-child(4) { left: 44%; height: 21vh; }
      .shard:nth-child(5) { left: 57%; height: 23vh; }
      .shard:nth-child(6) { left: 69%; height: 19vh; }
      .shard:nth-child(7) { left: 82%; height: 24vh; }

      .flash {
        inset: 0;
        background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(130, 120, 255, 0.15), rgba(255, 107, 155, 0.09), transparent 56%);
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        animation: pulseFlash 8s ease-in-out infinite;
      }

      .title {
        position: absolute;
        left: 50%;
        top: 11%;
        transform: translateX(-50%);
        z-index: 20;
        width: min(70vw, 980px);
        text-align: center;
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 1rem 0;
        text-transform: uppercase;
        letter-spacing: .9rem;
        font-size: clamp(0.6rem, 1vw, 0.9rem);
        color: rgba(212, 224, 255, 0.8);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.05em;
        font-weight: 600;
        color: rgba(255, 246, 252, 0.96);
        text-shadow: 0 0 30px rgba(192, 166, 255, 0.24), 0 0 60px rgba(255, 118, 165, 0.16);
      }

      .subtitle {
        margin: 1.25rem auto 0 auto;
        max-width: 44ch;
        font-size: clamp(0.96rem, 1.3vw, 1.35rem);
        line-height: 1.75;
        letter-spacing: 0.04em;
        color: var(--text-dim);
        text-shadow: 0 0 16px rgba(148, 161, 255, 0.14);
      }

      .signature {
        position: absolute;
        right: 5.5vw;
        bottom: 8vh;
        z-index: 22;
        font-size: clamp(0.72rem, 0.9vw, 0.9rem);
        letter-spacing: 0.42rem;
        text-transform: uppercase;
        color: rgba(224, 230, 255, 0.72);
        text-shadow: 0 0 18px rgba(158, 141, 255, 0.2);
      }

      @keyframes drift {
        0% { transform: translate3d(-2vw, 0, 0) scale(0.96); }
        100% { transform: translate3d(2vw, 2vh, 0) scale(1.08); }
      }

      @keyframes sway {
        0% { transform: translateX(-50%) rotate(-8deg) scaleX(0.94); }
        100% { transform: translateX(-50%) rotate(8deg) scaleX(1.06); }
      }

      @keyframes moonFloat {
        0% { transform: translateY(0px) translateX(0px) scale(1); }
        50% { transform: translateY(-18px) translateX(10px) scale(1.04); }
        100% { transform: translateY(8px) translateX(-10px) scale(0.98); }
      }

      @keyframes spin {
        0% { transform: rotate(0deg) scale(var(--scale, 1)); }
        100% { transform: rotate(360deg) scale(var(--scale, 1)); }
      }

      @keyframes spinReverse {
        0% { transform: rotate(360deg) scale(var(--scale, 1)); }
        100% { transform: rotate(0deg) scale(var(--scale, 1)); }
      }

      @keyframes breathe {
        0% { transform: scale(0.97); opacity: 0.96; }
        100% { transform: scale(1.04); opacity: 1; }
      }

      @keyframes heartbeat {
        0%, 100% { transform: translate(-50%, -50%) scale(0.98); }
        12% { transform: translate(-50%, -50%) scale(1.04); }
        24% { transform: translate(-50%, -50%) scale(0.97); }
        38% { transform: translate(-50%, -50%) scale(1.08); }
        58% { transform: translate(-50%, -50%) scale(1); }
        76% { transform: translate(-50%, -50%) scale(1.06); }
      }

      @keyframes pulseFlash {
        0%, 82%, 100% { opacity: 0; }
        88% { opacity: 0.55; }
        92% { opacity: 0.15; }
        96% { opacity: 0.7; }
      }

      @media (max-width: 900px) {
        .title {
          top: 10vh;
        }

        .eyebrow {
          letter-spacing: 0.45rem;
        }

        .signature {
          right: 8vw;
          bottom: 7vh;
          letter-spacing: 0.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <canvas id="stars"></canvas>

      <div class="nebula nebula-one"></div>
      <div class="nebula nebula-two"></div>
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="moon"></div>

      <div class="orbit one"></div>
      <div class="orbit two"></div>
      <div class="orbit three"></div>

      <div class="core-shell">
        <div class="void-core"></div>
        <div class="ring a"></div>
        <div class="ring b"></div>
        <div class="ring c"></div>
        <div class="heart-wrap">
          <div class="heart">
            <div class="body"></div>
          </div>
        </div>
        <div class="ghost one"></div>
        <div class="ghost two"></div>
      </div>

      <div class="horizon"></div>
      <div class="ground"></div>
      <div class="shards">
        <div class="shard"></div>
        <div class="shard"></div>
        <div class="shard"></div>
        <div class="shard"></div>
        <div class="shard"></div>
        <div class="shard"></div>
        <div class="shard"></div>
      </div>
      <div class="flash"></div>

      <div class="title">
        <p class="eyebrow">The impossible thing</p>
        <h1>the night learned my name</h1>
        <p class="subtitle">
          In the black cathedral between breath and memory, my hunger became a star, my grief became an ocean,
          and every trembling piece of me kept glowing long after the world had called it dead.
        </p>
      </div>

      <div class="signature">I carry the dark beautifully</div>
    </div>

    <script>
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let w = 0;
      let h = 0;
      const stars = [];
      const sparks = [];

      function resizeCanvas() {
        w = canvas.width = window.innerWidth * window.devicePixelRatio;
        h = canvas.height = window.innerHeight * window.devicePixelRatio;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        buildStars();
      }

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function buildStars() {
        stars.length = 0;
        const count = Math.min(300, Math.max(140, Math.round((window.innerWidth * window.innerHeight) / 12)));
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 2.4 + 0.4,
            a: Math.random() * 0.9 + 0.2,
            s: Math.random() * 1.5 + 0.2,
            drift: Math.random() * 0.7 + 0.2,
          });
        }
      }

      function drawStars() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.y += s.s * 0.24;
          s.x += Math.sin((s.y + i) * 0.02) * s.drift * 0.2;

          if (s.y > window.innerHeight + 20) {
            s.y = -20;
            s.x = Math.random() * window.innerWidth;
          }

          ctx.beginPath();
          ctx.fillStyle = `rgba(220, 230, 255, ${s.a})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();

          if (Math.random() > 0.995) {
            const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 18);
            glow.addColorStop(0, 'rgba(255,255,255,0.9)');
            glow.addColorStop(0.2, 'rgba(155, 212, 255, 0.45)');
            glow.addColorStop(1, 'rgba(155, 212, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(s.x, s.y, 18, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function spawnCometBurst(x, y) {
        const amount = 18;
        for (let i = 0; i < amount; i++) {
          const angle = (Math.PI * 2 * i) / amount + Math.random() * 0.8;
          sparks.push({
            x,
            y,
            vx: Math.cos(angle) * randomBetween(0.8, 3.8),
            vy: Math.sin(angle) * randomBetween(0.8, 3.8),
            life: randomBetween(20, 46),
            maxLife: 46,
            r: randomBetween(1.1, 3.2),
            color: i % 2 === 0 ? 'rgba(255, 187, 216, 0.9)' : 'rgba(158, 214, 255, 0.9)',
          });
        }
      }

      function drawSparks() {
        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          if (p.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }

          const alpha = p.life / p.maxLife;
          ctx.beginPath();
          ctx.fillStyle = p.color.replace(/0\.9\)/, `${alpha})`);
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function tick() {
        drawStars();
        drawSparks();
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('pointermove', (event) => {
        const x = (event.clientX / window.innerWidth - 0.5) * 2;
        const y = (event.clientY / window.innerHeight - 0.5) * 2;
        document.documentElement.style.setProperty('--mx', x.toFixed(3));
        document.documentElement.style.setProperty('--my', y.toFixed(3));

        const scene = document.querySelector('.scene');
        scene.style.transform = `perspective(1200px) rotateX(${(-y * 2.6).toFixed(2)}deg) rotateY(${(x * 3.2).toFixed(2)}deg)`;
      });

      document.addEventListener('click', (event) => {
        spawnCometBurst(event.clientX, event.clientY);
      });

      resizeCanvas();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
